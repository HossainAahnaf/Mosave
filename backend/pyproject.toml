[tool.poetry]
name = "mosave-backend"
version = "0.1.0"
description = "FastAPI backend scaffold for MoSave household finance mentor"
authors = ["MoSave Team <team@mosave.ai>"]
readme = "README.md"
packages = [
  { include = "app", from = "backend" }
]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.6" }
httpx = "^0.27.2"
openai = "^1.46.0"
python-dotenv = "^1.0.1"
pydantic = "^2.8.2"
pydantic-settings = "^2.4.0"
supabase = "^2.6.0"
numpy = "^2.1.1"
pandas = "^2.2.3"
scikit-learn = "^1.5.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
ruff = "^0.6.9"

[build-system]
requires = ["poetry-core>=1.8.2"]
build-backend = "poetry.core.masonry.api"
